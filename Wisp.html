<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wisp — ephemeral journaling</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Spectral:ital,wght@0,400;0,500;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { overflow: hidden; }
  #root { height: 100%; }

  .app {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    font-family: "Work Sans", system-ui, sans-serif;
    transition: background 1.4s ease, color 1.4s ease;
    overflow: hidden;
  }
  .ambient {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    transition: background 1.8s ease;
  }

  /* ---- top bar ---- */
  .topbar {
    position: relative; z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 28px; gap: 24px;
    flex: 0 0 auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 11px; height: 11px; border-radius: 50%;
    background: currentColor; opacity: 0.55;
    box-shadow: 0 0 14px 1px currentColor;
  }
  .brand-name { font-family: "Newsreader", serif; font-size: 21px; letter-spacing: .3px; }

  .hud {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; letter-spacing: .2px;
    position: absolute; left: 50%; transform: translateX(-50%);
  }
  .hud-stat { font-variant-numeric: tabular-nums; }
  .hud-sep { opacity: .5; }
  .hud-weather { width: 120px; margin-left: 6px; }

  .actions { display: flex; gap: 8px; align-items: center; }
  .ghost-btn {
    font: inherit; font-size: 13px; letter-spacing: .2px;
    color: inherit; background: transparent;
    border: 1px solid color-mix(in oklab, currentColor 22%, transparent);
    padding: 7px 14px; border-radius: 999px; cursor: pointer;
    transition: background .25s ease, border-color .25s ease, opacity .25s;
  }
  .ghost-btn:hover { background: color-mix(in oklab, currentColor 8%, transparent); }
  .ghost-btn:disabled { opacity: .35; cursor: default; }

  /* ---- stage / writing ---- */
  .stage { position: relative; flex: 1 1 auto; min-height: 0; z-index: 1; }
  .canvas-wrap {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    overflow: hidden;
  }
  .hidden-input {
    position: absolute; inset: 0; z-index: 3;
    width: 100%; height: 100%;
    background: transparent; border: 0; outline: 0; resize: none;
    color: transparent; caret-color: transparent;
    padding: 0; margin: 0; font-size: 16px;
  }
  .word-field {
    position: relative; z-index: 2;
    width: min(760px, 86%);
    margin: 0 auto; padding-bottom: 19vh;
    line-height: 1.74; letter-spacing: .1px;
    text-align: left; word-break: break-word;
  }
  .caret {
    display: inline-block; width: 2px; vertical-align: text-bottom;
    margin-left: 1px; border-radius: 2px;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 0%,50% { opacity: .9; } 50.01%,100% { opacity: 0; } }

  .prompts {
    position: relative; z-index: 2; text-align: center;
    width: min(640px, 86%); margin: 0 auto; padding-bottom: 22vh;
    animation: rise 1.2s ease both;
  }
  .prompt-lead {
    font-family: "Newsreader", serif; font-size: 30px; font-style: italic;
    opacity: .7; line-height: 1.4; text-wrap: balance;
  }
  .prompt-hint { margin-top: 18px; font-size: 13px; opacity: .42; letter-spacing: .3px; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .reassure {
    position: absolute; bottom: 18px; left: 0; right: 0; z-index: 4;
    text-align: center; font-size: 12px; letter-spacing: .3px;
    opacity: .55; pointer-events: none;
  }

  /* ---- weather ---- */
  .weather { width: 100%; }
  .weather-bar {
    display: flex; width: 100%; gap: 2px; border-radius: 999px; overflow: hidden;
  }
  .weather-bar > div { transition: flex .8s ease, background .8s ease; min-width: 3px; }
  .weather-empty {
    width: 100%; border-radius: 999px;
    background: color-mix(in oklab, currentColor 12%, transparent);
  }
  .weather-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 13px; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; }
  .legend-label { opacity: .85; }
  .legend-pct { opacity: .5; font-variant-numeric: tabular-nums; }

  /* ---- archive ---- */
  .archive { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .archive-head {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 4px 40px 22px;
  }
  .archive-title { font-family: "Newsreader", serif; font-size: 26px; text-align: center; }
  .archive-count { text-align: right; font-size: 13px; opacity: .5; }
  .archive-head .ghost-btn { justify-self: start; }

  .archive-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 340px 1fr; gap: 0; }
  .entry-list {
    overflow-y: auto; padding: 4px 24px 40px 40px;
    display: flex; flex-direction: column; gap: 10px;
    border-right: 1px solid color-mix(in oklab, currentColor 10%, transparent);
  }
  .entry-card {
    text-align: left; font: inherit; cursor: pointer;
    background: color-mix(in oklab, currentColor 4%, transparent);
    border: 1px solid transparent; border-radius: 14px;
    padding: 14px 16px; display: flex; flex-direction: column; gap: 9px;
    transition: background .2s, border-color .2s; color: inherit;
  }
  .entry-card:hover { background: color-mix(in oklab, currentColor 8%, transparent); }
  .entry-card.active {
    background: color-mix(in oklab, currentColor 9%, transparent);
    border-color: color-mix(in oklab, currentColor 20%, transparent);
  }
  .entry-card-top { display: flex; justify-content: space-between; font-size: 12px; }
  .entry-date { font-weight: 500; }
  .entry-time { opacity: .5; }
  .entry-snippet {
    font-family: "Newsreader", serif; font-size: 15px; line-height: 1.45; opacity: .8;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .entry-meta { font-size: 11.5px; opacity: .5; line-height: 1.4; }

  .reader { overflow-y: auto; }
  .reader-inner { max-width: 720px; margin: 0 auto; padding: 8px 48px 80px; }
  .reader-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 26px; }
  .reader-date { font-family: "Newsreader", serif; font-size: 24px; }
  .reader-sub { font-size: 13px; opacity: .55; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .del-btn {
    font: inherit; font-size: 12px; color: inherit; opacity: .5;
    background: transparent; border: 1px solid color-mix(in oklab, currentColor 18%, transparent);
    border-radius: 999px; padding: 5px 12px; cursor: pointer; transition: .2s;
  }
  .del-btn:hover { opacity: 1; color: oklch(0.55 0.17 26); border-color: currentColor; }
  .reader-weather { margin-bottom: 34px; }
  .reader-headline {
    margin-top: 16px; font-family: "Newsreader", serif; font-style: italic;
    font-size: 19px; opacity: .72; text-wrap: balance;
  }
  .reader-text { font-size: 22px; line-height: 1.85; word-break: break-word; white-space: pre-wrap; }

  .archive-empty {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 40px;
  }
  .archive-empty-lead { font-family: "Newsreader", serif; font-size: 30px; }
  .archive-empty-sub { font-size: 15px; opacity: .6; max-width: 420px; line-height: 1.6; }
  .archive-empty .ghost-btn { margin-top: 10px; }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: color-mix(in oklab, currentColor 16%, transparent); border-radius: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- plain helper scripts (set window globals) -->
<script src="mood.js"></script>
<script src="soundEngine.js"></script>
<script src="textModel.js"></script>

<!-- react/babel components -->
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="moodWeather.jsx"></script>
<script type="text/babel" src="writingCanvas.jsx"></script>
<script type="text/babel" src="archive.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
